# Canlı sunucu: Nakama + PostgreSQL + Caddy (HTTPS). Sunucuda /opt/textrun klasöründe çalışır.
# Gizli değerler (.env dosyası) yalnızca sunucuda durur, depoya girmez: bkz. kur.sh
# Oyun sunucusu dışarıya yalnızca Caddy üzerinden (443, şifreli) açılır; yönetim paneli (7351) yalnızca sunucunun içinden erişilebilir.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 5s
      timeout: 3s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.41.0
    restart: unless-stopped
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
        /nakama/nakama migrate up --database.address postgres:${DB_PASSWORD}@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 --database.address postgres:${DB_PASSWORD}@postgres:5432/nakama
        --logger.level INFO --session.token_expiry_sec 7200 --session.refresh_token_expiry_sec 2592000
        --socket.server_key ${SERVER_KEY}
        --session.encryption_key ${SESSION_KEY} --session.refresh_encryption_key ${REFRESH_KEY}
        --runtime.http_key ${HTTP_KEY}
        --console.username admin --console.password ${CONSOLE_PASSWORD} --console.signing_key ${CONSOLE_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./modules:/nakama/data/modules
    ports:
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nakama

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
