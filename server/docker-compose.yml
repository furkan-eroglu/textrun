# Yerel geliştirme sunucusu: Nakama + PostgreSQL.
# Şifreler yalnızca bu bilgisayardaki test içindir. Canlı sunucuda farklı, gizli değerler kullanılacak.
# Çalıştırma: docker compose up -d     Durdurma: docker compose down
# TEXTRUN_... ortam değişkenleri yalnızca test için değerleri geçersiz kılar. Boş bırakılırsa sunucu
# varsayılanları (server/src/config.ts) kullanılır: varsayılan değer burada ikinci kez yazılmaz.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.41.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 --database.address postgres:localdb@postgres:5432/nakama --logger.level DEBUG --session.token_expiry_sec 7200
        --runtime.env TEXTRUN_LOBBY_WAIT_MS=${TEXTRUN_LOBBY_WAIT_MS:-}
        --runtime.env TEXTRUN_WORD_COUNT=${TEXTRUN_WORD_COUNT:-}
        --runtime.env TEXTRUN_MAX_WPM=${TEXTRUN_MAX_WPM:-}
        --runtime.env TEXTRUN_FINISH_GRACE_MS=${TEXTRUN_FINISH_GRACE_MS:-}
        --runtime.env TEXTRUN_COUNTDOWN_MS=${TEXTRUN_COUNTDOWN_MS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./build:/nakama/data/modules
    # 7349 ve 7351 (yönetim paneli) yalnızca bu bilgisayardan erişilebilir (127.0.0.1); 7350 telefon testi için yerel ağa açık
    ports:
      - "127.0.0.1:7349:7349"
      - "7350:7350" # telefonla yerel ağdan test için açık; canlıda kapatılıp HTTPS arkasına alınmalı
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
