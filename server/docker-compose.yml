# Yerel geliştirme sunucusu: Nakama + PostgreSQL.
# Şifreler yalnızca bu bilgisayardaki test içindir. Canlı sunucuda farklı, gizli değerler kullanılacak.
# Çalıştırma: docker compose up -d     Durdurma: docker compose down
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.41.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 --database.address postgres:localdb@postgres:5432/nakama --logger.level DEBUG --session.token_expiry_sec 7200
        --runtime.env TEXTRUN_LOBBY_WAIT_MS=${TEXTRUN_LOBBY_WAIT_MS:-15000}
        --runtime.env TEXTRUN_WORD_COUNT=${TEXTRUN_WORD_COUNT:-40}
        --runtime.env TEXTRUN_MAX_WPM=${TEXTRUN_MAX_WPM:-250}
        --runtime.env TEXTRUN_FINISH_GRACE_MS=${TEXTRUN_FINISH_GRACE_MS:-20000}
        --runtime.env TEXTRUN_COUNTDOWN_MS=${TEXTRUN_COUNTDOWN_MS:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./build:/nakama/data/modules
    # Yalnızca bu bilgisayardan erişilebilir (127.0.0.1)
    ports:
      - "127.0.0.1:7349:7349"
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
